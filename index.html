<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title id="app-title">TARGO TATTOO | Custom Ink. Permanent Art.</title>
    <style id="base-styles">
        @import url('https://fonts.googleapis.com/css2?family=Prata&family=Montserrat:wght@300;400;500;600;700;800&display=swap');

        :root {
            --f-display: 'Prata', serif;
            --f-body: 'Montserrat', sans-serif;
            --transition-speed: 1.2s;
            --bezier-cinematic: cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* PREMIUM LUXURY HONEY PEANUT THEME SYSTEM */
        .theme-dark {
            --bg: #110702; /* Roasted peanut dark skin depth */
            --bg-ambient: #070301;
            --surface: #1e0f05; /* Deep peanut brown cream */
            --surface-card: #27150a;
            --border: rgba(245, 158, 11, 0.15); /* Soft Amber/Peanut Gold Glow */
            --border-hover: rgba(245, 158, 11, 0.35);
            --text-primary: #fffaf5; /* Warm creamy white */
            --text-secondary: rgba(255, 250, 245, 0.6);
            --accent: #f59e0b; /* Golden Honey Amber */
            --accent-glow: rgba(245, 158, 11, 0.22);
            --strip-lighting: rgba(245, 158, 11, 0.06);
            --overlay-grad: linear-gradient(to bottom, rgba(17, 7, 2, 0.45) 0%, rgba(17, 7, 2, 0.1) 40%, rgba(17, 7, 2, 0.7) 72%, rgba(11, 4, 1, 0.98) 100%);
            --phone-bezel: #1b0a03;
            --phone-shadow: 0 35px 75px rgba(0, 0, 0, 0.9);
        }

        /* PREMIUM LUXURY TARGO TATTOO THEME SYSTEM (DARK STUDIO) */
        .theme-targo {
            --bg: #030303; /* Deep pure studio charcoal black */
            --bg-ambient: #070707;
            --surface: #0a0a0a; /* Premium dark marble */
            --surface-card: #121212;
            --border: rgba(212, 175, 55, 0.12); /* Burnished Luxury Studio Gold Glow */
            --border-hover: rgba(212, 175, 55, 0.35);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.6);
            --accent: #d4af37; /* Gold Studio Accents */
            --accent-glow: rgba(212, 175, 55, 0.18);
            --strip-lighting: rgba(212, 175, 55, 0.05);
            --overlay-grad: linear-gradient(to bottom, rgba(3, 3, 3, 0.35) 0%, rgba(3, 3, 3, 0.05) 40%, rgba(3, 3, 3, 0.68) 75%, rgba(1, 1, 1, 0.98) 100%);
            --phone-bezel: #0a0a0a;
            --phone-shadow: 0 35px 75px rgba(212, 175, 55, 0.04);
        }

        .theme-light {
            --bg: #fdfaf5; /* Clean warm butter cream */
            --bg-ambient: #f7f3eb;
            --surface: #ffffff;
            --surface-card: #f9f5ed; /* Soft milky peanut butter texture */
            --border: rgba(217, 119, 6, 0.15); /* Warm Honey amber gold */
            --border-hover: rgba(217, 119, 6, 0.35);
            --text-primary: #1c0f05; /* Blackish Espresso */
            --text-secondary: rgba(28, 15, 5, 0.65);
            --accent: #d97706; /* Dark golden butter */
            --accent-glow: rgba(217, 119, 6, 0.12);
            --strip-lighting: rgba(217, 119, 6, 0.04);
            --overlay-grad: linear-gradient(to bottom, rgba(253, 250, 251, 0.3) 0%, rgba(253, 250, 251, 0.05) 40%, rgba(253, 250, 251, 0.62) 72%, rgba(253, 250, 251, 0.98) 100%);
            --phone-bezel: #ffffff;
            --phone-shadow: 0 25px 60px rgba(217, 119, 6, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            background-color: var(--bg-ambient);
            color: var(--text-primary);
            font-family: var(--f-body);
            min-height: 100vh;
            width: 100%;
            overflow-x: hidden;
            overflow-y: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 1.2s var(--bezier-cinematic), color 0.8s ease;
            padding: 24px 12px;
        }

        @media (max-width: 480px) {
            html, body {
                height: 100%;
                min-height: 100vh;
                overflow-y: auto;
                -webkit-overflow-scrolling: touch;
                padding: 0;
            }
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 50% 50%, var(--accent-glow), transparent 65%);
            opacity: 0.25;
            pointer-events: none;
            z-index: 1;
            transition: background 1.5s var(--bezier-cinematic);
        }

        /* PREMIUM FLOATING AUDIO SWITCH */
        .audio-control {
            position: fixed;
            top: 25px;
            right: 25px;
            background: rgba(30, 15, 5, 0.88); /* Peanut dark brown opacity */
            border: 1px solid var(--border);
            padding: 10px 18px;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            cursor: pointer;
            z-index: 999;
            backdrop-filter: blur(12px);
            transition: all 0.5s var(--bezier-cinematic);
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: var(--f-body);
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 0.08em;
            color: var(--text-primary);
            text-transform: uppercase;
        }

        .theme-light .audio-control {
            background: rgba(255, 255, 255, 0.92);
            color: #1a0f05;
        }

        .audio-control:hover {
            transform: scale(1.05);
            border-color: var(--accent);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .audio-control.playing {
            border-color: var(--accent);
            animation: audioPulse 2.5s infinite alternate ease-in-out;
            background: linear-gradient(135deg, rgba(30, 15, 5, 0.95), var(--accent-glow));
        }

        .theme-light .audio-control.playing {
            background: linear-gradient(135deg, #ffffff, rgba(217, 119, 6, 0.1));
        }

        @keyframes audioPulse {
            0% { box-shadow: 0 0 10px rgba(217, 119, 6, 0.2); }
            100% { box-shadow: 0 0 25px rgba(217, 119, 6, 0.6); }
        }

        /* DYNAMIC EQUALIZER INDICATORS */
        .eq-bars {
            display: flex;
            align-items: flex-end;
            gap: 2.5px;
            width: 14px;
            height: 12px;
        }

        .eq-bars .bar {
            width: 2px;
            height: 100%;
            background-color: var(--accent);
            border-radius: 1px;
            transform-origin: bottom;
            transform: scaleY(0.15);
            transition: transform 0.3s ease;
        }

        .audio-control.playing .eq-bars .bar {
            animation: bounce 0.8s ease-in-out infinite alternate;
        }

        .audio-control.playing .eq-bars .bar:nth-child(1) { animation-duration: 0.6s; animation-delay: 0.1s; }
        .audio-control.playing .eq-bars .bar:nth-child(2) { animation-duration: 0.9s; animation-delay: 0.3s; }
        .audio-control.playing .eq-bars .bar:nth-child(3) { animation-duration: 0.75s; animation-delay: 0.2s; }

        @keyframes bounce {
            0% { transform: scaleY(0.2); }
            100% { transform: scaleY(1); }
        }

        /* --- PHONE CANVAS FRAME --- */
        .phone-wrapper {
            position: relative;
            width: 390px;
            height: 844px;
            background: var(--phone-bezel);
            border-radius: 54px;
            padding: 11px;
            box-shadow: var(--phone-shadow);
            border: 1px solid var(--border);
            z-index: 10;
            transition: all 1.2s var(--bezier-cinematic);
        }

        @media (max-width: 480px), (max-height: 860px) {
            .phone-wrapper {
                width: 100%;
                height: 100vh;
                border-radius: 0;
                padding: 0;
                box-shadow: none;
                border: none;
            }
            .phone-bezel-details { display: none !important; }
        }

        .phone-screen {
            position: relative;
            width: 100%;
            height: 100%;
            background-color: var(--bg);
            border-radius: 43px;
            overflow: hidden;
            z-index: 2;
            display: flex;
            flex-direction: column;
            transition: background-color 1.2s var(--bezier-cinematic);
        }

        @media (max-width: 480px), (max-height: 860px) {
            .phone-screen { border-radius: 0; }
        }

        /* --- NOTCH & STATUS BAR --- */
        .phone-bezel-details {
            position: absolute;
            width: 100%;
            height: 100%;
            inset: 0;
            pointer-events: none;
            z-index: 100;
        }

        .notch {
            position: absolute;
            top: 22px;
            left: 50%;
            transform: translateX(-50%);
            width: 110px;
            height: 28px;
            background: #000;
            border-radius: 20px;
            z-index: 101;
        }

        .camera-lens {
            width: 10px;
            height: 10px;
            background: #0a0a1a;
            border-radius: 50%;
            position: absolute;
            right: 20px;
            top: 9px;
            box-shadow: inset 0 0 3px rgba(255,255,255,0.3);
        }

        .status-bar {
            position: absolute;
            top: 25px;
            width: 100%;
            padding: 0 42px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            font-weight: 700;
            color: var(--text-primary);
            z-index: 99;
            opacity: 0.85;
        }

        .status-bar-right {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .battery-icon {
            width: 17px;
            height: 9px;
            border: 1px solid var(--text-primary);
            border-radius: 2.5px;
            padding: 1px;
            display: inline-block;
        }

        .battery-fill {
            width: 100%;
            height: 100%;
            background: var(--text-primary);
            border-radius: 1px;
        }

        /* --- GLOWING LUX LIGHTING STRIPS --- */
        .strip-light {
            position: absolute;
            top: 0;
            width: 4px;
            height: 100%;
            background: linear-gradient(to bottom, transparent, var(--accent), transparent);
            box-shadow: 0 0 12px var(--accent);
            opacity: 0.25;
            z-index: 4;
            animation: stripPulse 3.5s infinite alternate ease-in-out;
        }
        .strip-left { left: 0; }
        .strip-right { right: 0; }

        @keyframes stripPulse {
            0% { opacity: 0.15; transform: scaleY(0.96); }
            100% { opacity: 0.45; transform: scaleY(1.03); }
        }

        /* --- BILLBOARD CAROUSEL --- */
        .billboard-container {
            width: 100%;
            height: 100%;
            position: relative;
        }

        .slide {
            position: absolute;
            inset: 0;
            opacity: 0;
            visibility: hidden;
            transition: opacity var(--transition-speed) var(--bezier-cinematic), visibility var(--transition-speed) var(--bezier-cinematic);
            display: flex;
            flex-direction: column;
            z-index: 10;
        }

        .slide-scroll-wrapper {
            position: absolute;
            inset: 0;
            z-index: 10;
            overflow-y: auto;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            -webkit-overflow-scrolling: touch;
        }

        .slide-scroll-wrapper::-webkit-scrollbar {
            width: 4px;
        }
        .slide-scroll-wrapper::-webkit-scrollbar-track {
            background: transparent;
        }
        .slide-scroll-wrapper::-webkit-scrollbar-thumb {
            background: rgba(245, 158, 11, 0.25);
            border-radius: 4px;
        }
        .slide-scroll-wrapper::-webkit-scrollbar-thumb:hover {
            background: rgba(245, 158, 11, 0.45);
        }

        .slide.active {
            opacity: 1;
            visibility: visible;
            z-index: 20;
        }

        .slide-bg-container {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .slide-bg-blur {
            position: absolute;
            inset: -40px;
            width: calc(100% + 80px);
            height: calc(100% + 80px);
            object-fit: cover;
            filter: blur(28px) brightness(0.28);
            z-index: 1;
            pointer-events: none;
            opacity: 0.92;
        }

        .slide-image {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: brightness(0.95);
            transition: filter 0.5s ease;
        }

        /* PREMIUM DYNAMIC MOTION KEYFRAMES */
        @keyframes kenBurnsBackdrop {
            0% { transform: scale(1.02) rotate(0deg); }
            50% { transform: scale(1.10) rotate(1.5deg); }
            100% { transform: scale(1.02) rotate(0deg); }
        }

        @keyframes cinematicForeground {
            0% { transform: scale(0.95) translateY(1%); }
            50% { transform: scale(1.03) translateY(-1%); }
            100% { transform: scale(0.95) translateY(1%); }
        }

        .slide.active .slide-bg-blur {
            animation: kenBurnsBackdrop 14s ease-in-out infinite;
        }

        .slide.active .slide-image {
            animation: cinematicForeground 12s ease-in-out infinite;
        }

        .slide-overlay {
            position: absolute;
            inset: 0;
            background: var(--overlay-grad);
            z-index: 3;
            transition: background 1s ease;
            pointer-events: none;
        }

        /* PROGRESS TRACK LINES */
        .progress-indicators {
            position: absolute;
            top: 60px;
            left: 20px;
            right: 20px;
            height: 2.5px;
            display: flex;
            gap: 5px;
            z-index: 101;
        }

        .indicator-track {
            flex: 1;
            background: rgba(255, 255, 255, 0.18);
            border-radius: 10px;
            overflow: hidden;
            height: 100%;
        }

        .theme-light .indicator-track {
            background: rgba(0, 0, 0, 0.08);
        }

        .indicator-fill {
            width: 0%;
            height: 100%;
            background: var(--accent);
            border-radius: 10px;
            transition: width 0.1s linear;
        }

        /* LUXURY BRAND SIGNATURE NAVIGATION AREA */
        .top-brand-bar {
            position: absolute;
            top: 70px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 105;
            background: transparent;
            border: none;
            padding: 0;
            box-shadow: none;
        }

        .brand-signature {
            display: flex;
            flex-direction: column;
            gap: 1.5px;
            align-items: flex-start;
            text-align: left;
        }

        .brand-sig-title {
            font-family: var(--f-display);
            font-size: 15px;
            font-weight: 500;
            letter-spacing: 0.12em;
            color: #ffffff;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.82);
            text-transform: uppercase;
            line-height: 1.1;
        }

        .brand-sig-sub {
            font-family: var(--f-body);
            font-size: 7.5px;
            font-weight: 700;
            letter-spacing: 0.18em;
            color: var(--accent);
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.82);
            text-transform: uppercase;
        }

        .theme-light .brand-sig-title {
            color: var(--text-primary);
            text-shadow: none;
        }

        .theme-light .brand-sig-sub {
            color: var(--accent);
            text-shadow: none;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 5px;
            background: rgba(0, 0, 0, 0.45);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 4px 10px;
            border-radius: 100px;
            font-size: 8px;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: #ffffff;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
        }

        .theme-light .status-badge {
            background: rgba(255, 255, 255, 0.72);
            border-color: rgba(0, 0, 0, 0.08);
            color: var(--text-primary);
            text-shadow: none;
        }

        .status-dot {
            width: 6.5px;
            height: 6.5px;
            border-radius: 50%;
            display: inline-block;
        }
        .status-dot.open {
            background: #10b981;
            box-shadow: 0 0 8px #10b981;
        }
        .status-dot.closed {
            background: #ef4444;
            box-shadow: 0 0 8px #ef4444;
        }

        /* CLOSED INFO ALERTER */
        .closed-alert {
            position: absolute;
            top: 152px;
            left: 20px;
            right: 20px;
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.35);
            padding: 6px 12px;
            border-radius: 10px;
            font-size: 9px;
            font-weight: 600;
            color: #fca5a5;
            display: flex;
            align-items: center;
            gap: 6px;
            justify-content: center;
            z-index: 105;
            backdrop-filter: blur(8px);
            text-transform: uppercase;
            letter-spacing: 0.02em;
        }

        .theme-light .closed-alert {
            background: rgba(239, 68, 68, 0.06);
            color: #ef4444;
        }

        /* PREMIUM BRAND SWITCHER CONTAINER */
        .brand-switch-container {
            position: absolute;
            top: 112px;
            left: 20px;
            right: 20px;
            height: 34px;
            background: rgba(18, 10, 5, 0.9);
            border: 1px solid var(--border);
            border-radius: 17px;
            display: flex;
            padding: 3px;
            z-index: 110;
            backdrop-filter: blur(12px);
            transition: all 0.5s var(--bezier-cinematic);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }
        .theme-targo .brand-switch-container {
            background: rgba(10, 10, 10, 0.9);
            border-color: rgba(212, 175, 55, 0.18);
        }
        .theme-light .brand-switch-container {
            background: rgba(255, 255, 255, 0.92);
            border-color: rgba(217, 119, 6, 0.12);
        }
        .brand-switch-btn {
            flex: 1;
            border: none;
            background: none;
            color: var(--text-secondary);
            font-family: var(--f-body);
            font-size: 8px;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.4s var(--bezier-cinematic);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }
        .brand-switch-btn.active {
            background: var(--accent);
            color: #110702 !important;
            box-shadow: 0 2px 8px var(--accent-glow);
        }

        /* --- BILLBOARD TEXT AND CONTENT --- */
        .slide-content {
            position: relative;
            z-index: 10;
            padding: 190px 24px 115px 24px; /* Generous top & bottom space for scrolling indicators, clock overlays & widgets */
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            width: 100%;
            min-height: 100%;
            justify-content: flex-end;
        }

        /* ART PORTFOLIO LIGHTBOX */
        .lightbox-modal {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.96);
            z-index: 300;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s var(--bezier-cinematic);
            backdrop-filter: blur(18px);
            padding: 24px;
        }
        .lightbox-modal.active {
            opacity: 1;
            pointer-events: auto;
        }
        .lightbox-close {
            position: absolute;
            top: 40px;
            right: 25px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            z-index: 305;
            transition: all 0.2s ease;
        }
        .lightbox-close:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(1.05);
        }
        .lightbox-content-wrapper {
            width: 100%;
            max-width: 330px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            z-index: 301;
        }
        .lightbox-content-wrapper img {
            width: 100%;
            max-height: 440px;
            object-fit: contain;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 0 0 15px var(--accent-glow);
            border: 1px solid var(--border);
            cursor: zoom-in;
            transition: transform 0.4s var(--bezier-cinematic);
        }
        .lightbox-content-wrapper img.zoomed {
            transform: scale(1.35);
            cursor: zoom-out;
        }
        .lightbox-caption {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--text-primary);
            text-align: center;
        }
        .lightbox-actions {
            width: 100%;
        }
        .lightbox-wa {
            background: linear-gradient(135deg, var(--accent), #fff) !important;
            color: #000 !important;
            box-shadow: 0 0 15px var(--accent-glow) !important;
        }

        .slide-title {
            font-family: var(--f-display);
            font-size: clamp(23px, 6vw, 29px);
            font-weight: 400;
            line-height: 1.25;
            letter-spacing: 0.02em;
            color: var(--text-primary);
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
            opacity: 0;
            transform: translateY(18px);
            transition: opacity 1.2s var(--bezier-cinematic) 0.3s, transform 1.2s var(--bezier-cinematic) 0.3s;
        }

        .slide.active .slide-title {
            opacity: 1;
            transform: translateY(0);
        }

        .slide-tagline {
            font-size: 9px;
            font-weight: 700;
            color: var(--accent);
            letter-spacing: 0.15em;
            margin-top: 6px;
            margin-bottom: 12px;
            text-transform: uppercase;
            opacity: 0;
            transform: translateY(12px);
            transition: all 1.2s var(--bezier-cinematic) 0.4s;
        }
        .slide.active .slide-tagline {
            opacity: 0.9;
            transform: translateY(0);
        }

        .slide-story-text {
            font-size: 11px;
            line-height: 1.6;
            color: var(--text-secondary);
            max-width: 310px;
            margin: 0 auto 16px auto;
            opacity: 0;
            transform: translateY(15px);
            transition: all 1.2s var(--bezier-cinematic) 0.5s;
        }
        .slide.active .slide-story-text {
            opacity: 0.85;
            transform: translateY(0);
        }

        .slide-badges-grid {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-bottom: 16px;
            flex-wrap: wrap;

        // CAROUSEL LOOP
        function startCarousel() {
            stopCarousel();
            if(!isGalleryOpen) {
                runTimeline();
            }
        }

        function stopCarousel() {
            clearTimeout(slideTimer);
            cancelAnimationFrame(progressInterval);
        }

        function runTimeline() {
            const totalSlides = BRANDS[currentBrand].slides.length + 1; // plus the final landmark slide
            const activeFill = document.getElementById(`indicator-fill-${currentActiveSlide}`);

            for(let i = 0; i < totalSlides; i++) {
                const fill = document.getElementById(`indicator-fill-${i}`);
                if(fill) {
                    fill.style.width = i < currentActiveSlide ? "100%" : "0%";
                }
            }

            let start = null;
            function step(timestamp) {
                if(!start) start = timestamp;
                const elapsed = timestamp - start;
                const percent = Math.min((elapsed / slideDuration) * 100, 100);

                if(activeFill) {
                    activeFill.style.width = `${percent}%`;
                }

                if(elapsed < slideDuration) {
                    progressInterval = requestAnimationFrame(step);
                } else {
                    changeToNextSlide();
                }
            }
            progressInterval = requestAnimationFrame(step);
        }

        function changeToNextSlide() {
            const totalSlides = BRANDS[currentBrand].slides.length + 1; // plus the final landmark slide
            const currentEl = document.getElementById(`slide-${currentActiveSlide}`);
            currentActiveSlide = (currentActiveSlide + 1) % totalSlides;
            const nextEl = document.getElementById(`slide-${currentActiveSlide}`);

            if(currentEl) currentEl.classList.remove("active");
            if(nextEl) nextEl.classList.add("active");

            runTimeline();
        }

        // FADE AUDIO PLAYBACK ENGINES
        function playAudio() {
            clearInterval(fadeInterval);
            try {
                if(audioObj.paused) {
                    audioObj.volume = 0;
                    audioObj.play().then(() => {
                        fadeVolume(0.85);
                    }).catch(err => {
                        console.log("Audio autoplay constrained by state policy. Listening for first user gesture.");
                    });
                } else {
                    fadeVolume(0.85);
                }
            } catch(e) {
                console.log(e);
            }
        }

        function pauseAudio() {
            clearInterval(fadeInterval);
            fadeVolume(0, true);
        }

        function fadeVolume(targetVol, stopAfter = false) {
            const step = 0.05;
            fadeInterval = setInterval(() => {
                if (stopAfter) {
                    if (audioObj.volume > step) {
                        audioObj.volume -= step;
                    } else {
                        audioObj.volume = 0;
                        audioObj.pause();
                        clearInterval(fadeInterval);
                    }
                } else {
                    if (audioObj.volume < targetVol - step) {
                        audioObj.volume += step;
                    } else {
                        audioObj.volume = targetVol;
                        clearInterval(fadeInterval);
                    }
                }
            }, 50);
        }

        function toggleAudio() {
            const btn = document.getElementById("audio-control-btn");
            const label = document.getElementById("audio-visual-state");

            if (audioObj.paused) {
                playAudio();
                if (btn) btn.classList.add("playing");
                if (label) label.textContent = "SOUND ON";
                sessionStorage.setItem("targo_audio_pref", "playing");
                showToast("🔊 Targo Tattoo ambient track active.");
            } else {
                pauseAudio();
                if (btn) btn.classList.remove("playing");
                if (label) label.textContent = "SOUND OFF";
                sessionStorage.setItem("targo_audio_pref", "paused");
                showToast("🔇 Soundtrack faded out.");
            }
        }

        // Auto-resume upon first viewport touch gesture if user had saved playing state
        document.addEventListener("click", () => {
            if(sessionStorage.getItem("targo_audio_pref") === "playing" && audioObj.paused) {
                const btn = document.getElementById("audio-control-btn");
                const label = document.getElementById("audio-visual-state");
                playAudio();
                if (btn) btn.classList.add("playing");
                if (label) label.textContent = "SOUND ON";
            }
        }, { once: true });

        // LIVE SYSTEM CLOCK LOGIC
        function runLiveDeviceClock() {
            function update() {
                const now = new Date();
                let hours = now.getHours();
                let minutes = now.getMinutes();
                hours = hours < 10 ? '0' + hours : hours;
                minutes = minutes < 10 ? '0' + minutes : minutes;
                document.getElementById("live-phone-time").textContent = `${hours}:${minutes}`;
                updateBusinessSchedule();
            }
            update();
            setInterval(update, 20000); // Check and periodically sync device hours
        }

        buildApplet();
